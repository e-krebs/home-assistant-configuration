recorder:
  include:
    entities:
      - person.manu

person:
  - name: manu
    id: manu
    device_trackers:
      - device_tracker.manu_wifi

template:
  - binary_sensor:
      - device_class: occupancy
        default_entity_id: binary_sensor.manu
        state: "{{ is_state('person.manu', 'home') }}"
        name: manu

homeassistant:
  customize:
    device_tracker.manu_wifi:
      icon: mdi:cellphone-wireless
      friendly_name: pixel 9 pro (wifi)

    person.manu:
      icon: mdi:human-male
