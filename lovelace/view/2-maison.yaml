title: maison
icon: mdi:home
cards:
  - type: heading
    heading: CD Luc
    icon: mdi:disc-player
    badges:
      - type: entity
        entity: binary_sensor.luc_cd_state
        color: state
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.luc_cd_power
        tap_action:
          action: more-info
      - type: entity
        entity: switch.luc_cd
        color: state
        icon: mdi:power-socket-eu
        tap_action:
          action: more-info
  - type: vertical-stack
    cards:
      - type: heading
        heading: media center
        icon: mdi:multimedia
        badges:
          - type: button
            entity: media_player.beam
            icon: mdi:surround-sound
            text: beam
            tap_action:
              action: more-info
      - type: horizontal-stack
        cards:
          - type: tile
            entity: media_player.ps4_universal
            features:
              - type: "media-player-playback"
              - type: "media-player-volume-slider"
          - type: tile
            entity: media_player.shield_universal
            features:
              - type: "media-player-playback"
              - type: "media-player-volume-slider"
