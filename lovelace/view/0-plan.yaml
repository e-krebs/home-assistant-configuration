title: général
icon: mdi:floor-plan
cards:
  - type: grid
    title: overview
    square: false
    columns: 2
    cards:
      - type: tile
        entity: person.manu
      - type: tile
        entity: sensor.machine_a_laver
      - type: tile
        entity: switch.pc_universal
      - type: tile
        entity: switch.ecran
      - type: tile
        entity: binary_sensor.luc_cd_state
        color: yellow
        icon_tap_action:
          action: more-info
          entity: switch.luc_cd
      - type: tile
        entity: media_player.ps4_universal
      - type: tile
        entity: media_player.beam
      - type: tile
        entity: media_player.shield_universal
  - type: vertical-stack
    title: météo
    cards:
      - type: heading
        heading: risque d'allergies
        icon: mdi:flower-pollen
        badges:
          - type: entity
            entity: sensor.qualite_globale_pollen_les_lilas
            state_content: Libellé
            show_icon: false
          - type: entity
            entity: sensor.qualite_globale_pollen_les_lilas_j_1
            state_content: Libellé
            icon: mdi:fast-forward
      - type: heading
        heading: qualité de l'air
        icon: mdi:lungs
        badges:
          - type: entity
            entity: sensor.qualite_globale_les_lilas
            state_content: Libellé
            show_icon: false
          - type: entity
            entity: sensor.qualite_globale_les_lilas_j_1
            state_content: Libellé
            icon: mdi:fast-forward
      - type: horizontal-stack
        cards:
          - type: markdown
            content: >
              <center> {{ states('weather.lilas') }} </center>
          - type: tile
            entity: sensor.lilas_cloud_cover
            features:
              - type: "bar-gauge"
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.lilas_daily_precipitation
                features:
                  - type: "bar-gauge"
              - type: tile
                entity: sensor.lilas_rain_chance
                features:
                  - type: "bar-gauge"
          - type: horizontal-stack
            cards:
              - type: tile
                entity: weather.tomorrow_io_home_daily
                features:
                  - type: "precipitation-forecast"
                    forecast_type: hourly
              - type: tile
                entity: weather.lilas
                features:
                  - type: "precipitation-forecast"
                    forecast_type: hourly
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.lilas_snow_chance
                features:
                  - type: "bar-gauge"
              - type: tile
                entity: sensor.lilas_freeze_chance
                features:
                  - type: "bar-gauge"
  - type: vertical-stack
    cards:
      - type: horizontal-stack
        cards:
          - type: tile
            entity: weather.tomorrow_io_home_daily
            features:
              - type: "temperature-forecast"
                forecast_type: daily
                days_to_show: 5
          - type: tile
            entity: weather.tomorrow_io_home_daily
            features:
              - type: "precipitation-forecast"
                forecast_type: daily
                days_to_show: 5
                precipitation_type: amount
      - type: horizontal-stack
        cards:
          - type: tile
            entity: weather.lilas
            features:
              - type: "temperature-forecast"
                forecast_type: daily
                days_to_show: 5
          - type: tile
            entity: weather.lilas
            features:
              - type: "precipitation-forecast"
                forecast_type: daily
                days_to_show: 5
                precipitation_type:
      - type: custom:horizon-card
