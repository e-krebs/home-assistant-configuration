title: garage
icon: mdi:garage
cards:
  - type: vertical-stack
    cards:
      - type: heading
        heading: bureau
        icon: mdi:desk
        badges:
          - type: entity
            entity: switch.pc_universal
            color: state
            state_content: name
            name: pc
            tap_action:
              action: toggle
          - type: entity
            entity: switch.ecran
            color: state
            state_content: name
            name: écran
            tap_action:
              action: toggle
          - type: entity
            entity: sensor.zigbee_4b_battery
            color: state
            tap_action:
              action: more-info
      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.pc_power
            features:
              - type: "trend-graph"
          - type: tile
            entity: sensor.ecran_power
            features:
              - type: "trend-graph"
  - type: vertical-stack
    cards:
      - type: heading
        heading: machine à laver
        icon: mdi:washing-machine
        badges:
          - type: entity
            entity: sensor.machine_a_laver
            color: state
            state_content: state
            tap_action:
              action: more-info
          - type: entity
            entity: switch.laver_switch
            icon: mdi:power-socket-eu
            color: state
            tap_action:
              action: more-info
      - type: tile
        entity: sensor.laver_power
        features:
          - type: "trend-graph"
            hours_to_show: 48
